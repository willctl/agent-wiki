[package]
name = "aw-core"
description = "Agent Wiki's storage: paths, pages, index, log, search, inbox, locks, request log, secret guard"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
fancy-regex.workspace = true
sha2.workspace = true
chrono.workspace = true
getrandom.workspace = true
unicode-normalization.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Security_Credentials"] }
